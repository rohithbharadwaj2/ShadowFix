experiment: mask_guided
model:
  type: mask_guided_unet
  input_channels: 4
  output_channels: 3
  base_channels: 32
  use_mask_input: true
training:
  image_size: 256
  batch_size: 8
  epochs: 50
  learning_rate: 0.0002
  mixed_precision: true
loss:
  shadow_weight: 4.0
  nonshadow_weight: 1.0
  edge_weight: 0.05

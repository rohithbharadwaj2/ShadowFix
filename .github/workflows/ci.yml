name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow opencv-python-headless

      - name: Compile extracted demo utilities
        run: python -m py_compile app/demo_utils.py

      - name: Validate benchmark CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('results/model_comparison.csv')
          assert path.exists(), 'Missing benchmark CSV'
          rows = list(csv.DictReader(path.open()))
          assert len(rows) == 4
          best = rows[0]
          assert best['model'] == 'Mask-Guided U-Net'
          assert best['psnr'] == '30.189'
          assert best['ssim'] == '0.9514'
          print('Repository validation passed.')
          PY
